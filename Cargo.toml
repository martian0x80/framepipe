[package]
name = "openstudio"
version = "0.1.0"
edition = "2024"

[dependencies]
drm = "0.14.1"
drm-sys = "0.8.0"
env_logger = "0.11.9"
eyre = "0.6.12"
fastrand = "2.3.0"
gbm = { version = "0.18.0", features = ["drm-support"] }
gl = "0.14.0"
glow = "0.16.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
log = "0.4.29"
serde = "1.0.228"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }
