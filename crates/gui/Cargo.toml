[package]
name = "framepipe-gui"
version.workspace = true
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["advanced", "debug", "tokio", "image"] }
wgpu = "29.0.1"
framepipe = { path = "../app" }
common = { path = "../common" }
env_logger = "0.11.9"
log = { workspace = true }
bytemuck = "1.25.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
clap = { workspace = true, features = ["derive"] }
chrono = "0.4.44"
dirs = "6.0.0"
