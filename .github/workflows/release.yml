name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: bash .github/scripts/install-system-deps.sh ubuntu

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Verify linking
        run: |
          ldd target/release/framepipe || true
          ldd target/release/framepipe-privd || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: framepipe-x86_64-unknown-linux-gnu
          path: |
            target/release/framepipe
            target/release/framepipe-privd
            target/release/*gui*

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: framepipe-x86_64-unknown-linux-gnu
          path: artifacts

      - name: Package
        run: |
          archive_dir=framepipe-x86_64-unknown-linux-gnu
          archive_name=${archive_dir}.tar.gz
          mkdir -p release/${archive_dir}
          cp artifacts/* release/${archive_dir}/
          tar -czvf "${archive_name}" -C release "${archive_dir}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: framepipe-x86_64-unknown-linux-gnu.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
